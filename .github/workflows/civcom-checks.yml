name: CIVCOM checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - name: Generators
        run: brew install xcodegen swiftgen sourcery swiftformat swiftlint
      - name: Generate
        run: xcodegen
      - name: Behavioral policy checks
        run: |
          swiftc -o /tmp/civcom-policy ElementX/Sources/Application/Settings/CIVCOMPolicy.swift Tools/CIVCOM/PolicyChecks.swift
          /tmp/civcom-policy
      - name: Compile for simulator
        run: |
          xcodebuild -project ElementX.xcodeproj -scheme ElementX -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Full native Core unit tests
        run: |
          xcodebuild -project ElementX.xcodeproj -scheme UnitTests -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath build/DerivedData -parallel-testing-enabled NO -resultBundlePath build/CoreUnitTests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
